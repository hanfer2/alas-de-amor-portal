name: CI

# Gratis: el repositorio es público, así que GitHub Actions no cobra minutos.
on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Rastreo de humo del sitio compilado
        run: |
          npm start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/robots.txt > /dev/null && break
            sleep 1
          done
          npm run smoke
